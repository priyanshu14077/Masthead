[project]
name = "blog-studio"
version = "0.1.0"
description = "Local campaign manager for the portfolio blog: ideas to outlines, drafts, checks and commits."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.scripts]
studio = "studio.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "blog-studio"
version = "0.1.0"
description = "Masthead: the publishing desk for engineering teams."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "cryptography>=43",
  "stripe>=11",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
blog-studio = "blog_studio.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blog_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLW", "RUF"]
ignore = ["E501"]  # prompts are long strings

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

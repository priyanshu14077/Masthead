<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masthead</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">Masthead</a>
      <div class="status" id="status"></div>
    </header>
    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
